name: Builds, tests

on:
  pull_request:
  push:
    branches:
    - master
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - "4.14"
          - "5.0"
          - "5.1"
          - "5.2"
          - "5.3"
          - "5.4"
        libev:
          - true
          - false
        include:
          - os: ubuntu-24.04-arm
            ocaml-compiler: "5.4"
            libev: false
          - os: macos-latest
            ocaml-compiler: "5.4"
            libev: false
          - os: windows-latest
            ocaml-compiler: "5.4"
            libev: false
          - os: windows-latest
            ocaml-compiler: "ocaml-variants.4.14.2+options,host-system-msvc"
            libev: false
          - os: windows-latest
            ocaml-compiler: "ocaml-variants.4.14.2+options,host-system-mingw"
            libev: false
          - os: ubuntu-latest
            ocaml-name: "5.4.0+32bit"
            ocaml-compiler: "ocaml-variants.5.4.0+options,ocaml-option-32bit"
            libev: false


    runs-on: ${{ matrix.os }}

    name:
       ${{ matrix.ocaml-name != '' && matrix.ocaml-name || matrix.ocaml-compiler}} / ${{ matrix.os }} / libev=${{ matrix.libev}}

    steps:

      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: set ppx-related variables
        id: configpackages
        shell: bash
        run: |
          opam exec -- ocaml src/util/letppx.ml
          opam exec -- ocaml src/util/letppx.ml >> "$GITHUB_OUTPUT"

      - run: opam install conf-libev
        if: ${{ matrix.libev == true }}

      - run: opam install ./lwt.opam ./lwt_react.opam ./lwt_retry.opam ./lwt_ppx.opam --deps-only --with-test

      - run: opam install ./lwt_ppx__ppx_let_tests.opam --deps-only --with-test
        if: ${{ fromJSON(steps.configpackages.outputs.letppx) }}

      - run: opam install ./lwt_direct.opam --deps-only --with-test
        if: ${{ fromJSON(steps.configpackages.outputs.direct) }}

      - run: opam install ./lwt_runtime_events.opam --deps-only --with-test
        if: ${{ fromJSON(steps.configpackages.outputs.runtime_events) }}

      - run: opam exec -- dune build --only-packages lwt,lwt_react,lwt_retry

      - run: opam exec -- dune build --only-packages lwt,lwt_ppx__ppx_let_tests
        if: ${{ fromJSON(steps.configpackages.outputs.letppx) }}

      - run: opam exec -- dune build --only-packages lwt,lwt_direct
        if: ${{ fromJSON(steps.configpackages.outputs.direct) }}

      - run: opam exec -- dune build --only-packages lwt,lwt_runtime_events
        if: ${{ fromJSON(steps.configpackages.outputs.runtime_events) }}

      - run: opam exec -- dune runtest --only-packages lwt,lwt_react,lwt_retry,lwt_ppx

      - run: opam exec -- dune runtest --only-packages lwt,lwt_ppx__ppx_let_tests
        if: ${{ fromJSON(steps.configpackages.outputs.letppx) }}

      - run: opam exec -- dune runtest --only-packages lwt,lwt_direct
        if: ${{ fromJSON(steps.configpackages.outputs.direct) }}

      - run: opam exec -- dune runtest --only-packages lwt,lwt_runtime_events
        if: ${{ fromJSON(steps.configpackages.outputs.runtime_events) }}

  # The js_of_ocaml smoke test.  It is a separate job because js_of_ocaml is not a
  # dependency of lwt and must not become one: the test cannot be a dune rule in
  # the tree, so it is a script that runs in a switch that has the backend.
  #
  # What it protects is stated in test/jsoo/smoke.sh: the per-domain shim keys on
  # the COMPILER version through cppo, not on the backend, so it takes the
  # Domain.DLS branch under js_of_ocaml, and that is only correct because
  # js_of_ocaml implements the primitive.  Nothing else in the suite would notice
  # if a backend stopped doing so.
  js_of_ocaml:
    runs-on: ubuntu-latest

    name: js_of_ocaml / 5.4

    steps:

      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      - run: opam install ./lwt.opam --deps-only

      - run: opam install js_of_ocaml js_of_ocaml-compiler

      - run: node --version

      - run: opam exec -- sh test/jsoo/smoke.sh
